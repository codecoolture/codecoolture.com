name: build
on: [push]
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: "yarn"
      - run: "yarn install"
      - run: "yarn analyze"
  test:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: "yarn"
      - run: "yarn install"
      - run: "yarn ci:test"

  test_acceptance:
    needs: analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: "24.20.0"
          cache: "yarn"
      - run: "yarn install"
      - run: "yarn ci:test:acc"
